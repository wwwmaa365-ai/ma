name: Expo EAS Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build profile (preview = APK, production = AAB)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  eas-android-build:
    name: Trigger Expo EAS Cloud Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Run EAS Android Build
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive --no-wait
