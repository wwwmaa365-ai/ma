name: EAS Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build profile (preview = APK, production = AAB)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: eas-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eas-build-android:
    name: Build SANJIT SHOP PARTNER APK (Expo EAS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify EXPO_TOKEN secret is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret. Create an access token at https://expo.dev/settings/access-tokens and add it under GitHub Repo Settings -> Secrets and variables -> Actions -> New repository secret (name: EXPO_TOKEN)."
            exit 1
          fi

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      - name: Verify Expo Android configuration
        run: npx expo config --type public

      - name: Trigger Expo EAS Android APK Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
